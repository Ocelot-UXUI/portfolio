<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Remi AI 记忆助手｜郭昱成作品集" />
    <title>Remi AI 记忆助手 | 郭昱成作品集</title>
    <link rel="stylesheet" href="../styles/styles.css?v=20260726-4" />
    <link rel="stylesheet" href="../styles/project-navigation.css?v=20260805-19" />
    <script src="../scripts/project-navigation.js?v=20260805-3" defer></script>
    <style>
      .demo-page>header{background:rgba(6,7,12,.34);-webkit-backdrop-filter:blur(30px) saturate(185%);backdrop-filter:blur(30px) saturate(185%);box-shadow:inset 0 1px rgba(255,255,255,.08)}.demo-page>header:focus-within{background:rgba(6,7,12,.52);box-shadow:0 14px 38px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.09)}.demo-page{height:100vh;overflow:hidden}.demo-action-bar{height:44px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #dfe3ed;background:#edf0f7;color:#5c6272}.demo-action-label{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;white-space:nowrap}.demo-action-label:before{content:"";width:6px;height:6px;border-radius:50%;background:#7c5ce3;box-shadow:0 0 0 3px rgba(124,92,227,.14)}.demo-action-controls{display:flex;align-items:center;gap:8px}.demo-action-controls button{height:28px;padding:0 11px;border:1px solid #d3d8e4;border-radius:5px;background:#fff;color:#414758;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .18s ease,background .18s ease,color .18s ease}.demo-action-controls button:hover,.demo-action-controls button:focus-visible{border-color:#8b70e7;background:#f7f4ff;color:#6043c5;outline:none}.demo-shell{height:calc(100vh - 100px);background:#edf0f7;padding:0 18px 18px;display:flex}.demo-shell iframe{border:0;width:100%;height:100%;border-radius:10px;background:#fff;box-shadow:0 10px 24px rgba(36,40,72,.12)}@media(max-width:700px){.demo-action-bar{padding:0 12px}.demo-action-label{font-size:11px}.demo-action-controls{gap:5px}.demo-action-controls button{height:27px;padding:0 8px;font-size:11px}}
    </style>
  </head>
  <body class="demo-page">
    <header class="project-nav"><a class="project-back" href="../index.html"><span>←</span>返回首页</a><p class="project-nav-title">主动式 AI 记忆助手</p><label class="project-view-switch"><span>当前展示</span><select aria-label="切换主动式 AI 记忆助手展示" data-view-switch data-current="remi.html"><option value="case.html">案例 Deck</option><option value="remi.html" selected>交互 Demo</option><option value="remi-materials.html">交付物</option></select></label></header>
    <div class="demo-action-bar" aria-label="动作模拟器">
      <span class="demo-action-label">动作模拟器</span>
      <div class="demo-action-controls">
        <button type="button" data-demo-action="import">模拟导入文件</button>
        <button type="button" data-demo-action="chat">模拟外部对话</button>
      </div>
    </div>
    <main class="demo-shell">
      <iframe id="remi-demo-frame" title="Remi AI 记忆助手交互项目" src="https://ocelot-uxui.github.io/remi-app/"></iframe>
    </main>
    <script>
      document.querySelectorAll("[data-view-switch]").forEach((viewSwitch) => {
        viewSwitch.addEventListener("change", () => {
          const option = viewSwitch.selectedOptions[0];
          if (!option.value) return;
          if (option.dataset.external === "true") {
            window.open(option.value, "_blank", "noopener");
            viewSwitch.value = viewSwitch.dataset.current;
            return;
          }
          window.location.href = option.value;
        });
      });

      const demoFrame = document.querySelector("#remi-demo-frame");
      document.querySelectorAll("[data-demo-action]").forEach((button) => {
        button.addEventListener("click", () => {
          demoFrame?.contentWindow?.postMessage(
            { type: "remi-demo-action", action: button.dataset.demoAction },
            "https://ocelot-uxui.github.io"
          );
        });
      });
    </script>
  </body>
</html>
