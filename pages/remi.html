<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Remi AI 记忆助手｜郭昱成作品集" />
    <title>Remi AI 记忆助手 | 郭昱成作品集</title>
    <link rel="stylesheet" href="../styles/styles.css?v=20260726-4" />
    <link rel="stylesheet" href="../styles/project-navigation.css?v=20260807-9" />
    <script src="../scripts/project-navigation.js?v=20260807-2" defer></script>
    <style>
      .demo-page {
        height: 100vh;
        overflow: hidden;
      }

      .demo-action-bar {
        position: relative;
        z-index: 2;
        height: 44px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid rgba(16, 18, 24, .055);
        background: #f8f9fb;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        box-shadow: none;
        color: #1b1c22;
        font-family: "Space Grotesk", "Noto Sans SC", "Source Han Sans SC", "PingFang SC", Arial, sans-serif;
      }

      .demo-action-label {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: rgba(27, 28, 34, .72);
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .demo-action-label::before {
        content: "";
        flex: 0 0 7px;
        width: 7px;
        height: 7px;
        border: 2px solid rgba(27, 28, 34, .54);
        border-radius: 50%;
        background: transparent;
        box-shadow: 0 0 0 3px rgba(27, 28, 34, .035);
      }

      .demo-action-controls {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
      }

      .demo-action-controls button {
        height: 32px;
        padding: 0 13px;
        border: 1px solid rgba(16, 18, 24, .1);
        border-radius: 999px;
        background: rgba(255, 255, 255, .62);
        color: rgba(27, 28, 34, .72);
        box-shadow: 0 1px 5px rgba(15, 23, 42, .045), inset 0 1px rgba(255, 255, 255, .62);
        font: 500 12px/1 "Space Grotesk", "Noto Sans SC", "Source Han Sans SC", "PingFang SC", Arial, sans-serif;
        letter-spacing: 0;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color .2s ease, border-color .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
      }

      .demo-action-controls button:hover,
      .demo-action-controls button:focus-visible {
        border-color: rgba(16, 18, 24, .18);
        background: rgba(16, 18, 24, .08);
        color: #1b1c22;
        box-shadow: inset 0 0 0 1px rgba(16, 18, 24, .04);
        outline: none;
      }

      .demo-action-controls button:focus-visible {
        outline: 2px solid rgba(27, 28, 34, .24);
        outline-offset: 2px;
      }

      .demo-action-controls button:active {
        transform: translateY(1px);
      }

      @media (hover: hover) and (pointer: fine) {
        body.demo-nav-hidden > .project-nav {
          transform: translateY(calc(-100% - 52px)) !important;
        }

        body.demo-nav-hidden > .demo-nav-companion {
          position: fixed;
          inset: 56px 0 auto;
          z-index: 1199;
          width: 100%;
          transform: translateY(calc(-100% - 64px));
          transition: transform .32s cubic-bezier(.22, 1, .36, 1);
        }

        body.demo-nav-hidden.demo-nav-hovering > .demo-nav-companion,
        body.demo-nav-hidden > .demo-nav-companion:focus-within {
          transform: translateY(0);
        }

        body.demo-nav-hidden:has(> .demo-nav-companion:focus-within) > .project-nav {
          transform: translateY(0) !important;
        }

        body.demo-page.demo-nav-hidden .demo-shell {
          height: 100vh !important;
        }
      }

      .demo-shell {
        height: calc(100vh - 100px);
        padding: 0 18px 18px;
        display: flex;
        background: #edf0f7;
      }

      .demo-shell iframe {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(36, 40, 72, .12);
      }

      @media (max-width: 700px) {
        .demo-action-bar {
          padding: 0 10px;
          gap: 10px;
        }

        .demo-action-label {
          gap: 7px;
          font-size: 11px;
        }

        .demo-action-controls {
          gap: 5px;
        }

        .demo-action-controls button {
          height: 30px;
          padding: 0 9px;
          font-size: 11px;
        }

      }
    </style>
  </head>
  <body class="demo-page light-project-nav">
    <header class="project-nav"><a class="project-back" href="../index.html" aria-label="返回首页"><span aria-hidden="true">←</span><span class="project-back-label">返回首页</span></a><p class="project-nav-title">主动式 AI 记忆助手</p><label class="project-view-switch"><span>当前展示</span><select aria-label="切换主动式 AI 记忆助手展示" data-view-switch data-current="remi.html"><option value="case.html">案例 Deck</option><option value="remi.html" selected>交互 Demo</option><option value="remi-materials.html">交付物</option></select></label></header>
    <div class="demo-action-bar demo-nav-companion" aria-label="动作模拟器">
      <span class="demo-action-label">动作模拟器</span>
      <div class="demo-action-controls">
        <button type="button" data-demo-action="import">模拟导入文件</button>
        <button type="button" data-demo-action="chat">模拟外部对话</button>
      </div>
    </div>
    <main class="demo-shell">
      <iframe id="remi-demo-frame" title="Remi AI 记忆助手交互项目" src="https://ocelot-uxui.github.io/remi-app/"></iframe>
    </main>
    <script>
      document.querySelectorAll("[data-view-switch]").forEach((viewSwitch) => {
        viewSwitch.addEventListener("change", () => {
          const option = viewSwitch.selectedOptions[0];
          if (!option.value) return;
          if (option.dataset.external === "true") {
            window.open(option.value, "_blank", "noopener");
            viewSwitch.value = viewSwitch.dataset.current;
            return;
          }
          window.location.href = option.value;
        });
      });

      const demoFrame = document.querySelector("#remi-demo-frame");
      document.querySelectorAll("[data-demo-action]").forEach((button) => {
        button.addEventListener("click", () => {
          demoFrame?.contentWindow?.postMessage(
            { type: "remi-demo-action", action: button.dataset.demoAction },
            "https://ocelot-uxui.github.io"
          );
        });
      });
    </script>
  </body>
</html>
