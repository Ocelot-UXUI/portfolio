<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Remi AI 记忆助手｜郭昱成作品集" />
    <title>Remi AI 记忆助手 | 郭昱成作品集</title>
    <link rel="stylesheet" href="../styles/styles.css?v=20260725-3" />
    <style>
      .demo-page{height:100vh;overflow:hidden}.demo-shell{height:calc(100vh - 56px);background:#edf0f7;padding:18px;display:flex;flex-direction:column;gap:14px}.demo-note{height:35px;display:flex;align-items:center;gap:20px;padding:0 8px;font-size:12px;color:#55586b}.demo-note span{color:#7456dd;font-weight:700}.demo-note a{margin-left:auto;color:#5135b2;text-decoration:none;font-weight:700}.demo-shell iframe{border:0;width:100%;flex:1;border-radius:10px;background:#fff;box-shadow:0 10px 24px rgba(36,40,72,.12)}@media(max-width:700px){.demo-note b{display:none}}
    </style>
  </head>
  <body class="demo-page">
    <header><a href="../index.html">← 返回首页</a><p>REMI / LIVE PRODUCT DEMO</p><label class="project-view-switch"><span class="project-view-switch-label">当前展示</span><span class="project-view-switch-control"><select aria-label="切换主动式 AI 记忆助手展示" data-view-switch data-current="remi.html"><option value="case.html">案例 Deck</option><option value="remi.html" selected>交互 Demo</option><option value="remi-materials.html">交付物</option></select></span></label></header>
    <main class="demo-shell">
      <div class="demo-note"><span>01 / Remi AI 记忆助手</span><b>可直接操作真实产品 Demo</b><a href="https://ocelot-uxui.github.io/remi-app/" target="_blank" rel="noreferrer">在新窗口打开 ↗</a></div>
      <iframe title="Remi AI 记忆助手交互项目" src="https://ocelot-uxui.github.io/remi-app/"></iframe>
    </main>
    <script>
      document.querySelectorAll("[data-view-switch]").forEach((viewSwitch) => {
        viewSwitch.addEventListener("change", () => {
          const option = viewSwitch.selectedOptions[0];
          if (!option.value) return;
          if (option.dataset.external === "true") {
            window.open(option.value, "_blank", "noopener");
            viewSwitch.value = viewSwitch.dataset.current;
            return;
          }
          window.location.href = option.value;
        });
      });
    </script>
  </body>
</html>
