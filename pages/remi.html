<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Remi AI 记忆助手｜郭昱成作品集" />
    <title>Remi AI 记忆助手 | 郭昱成作品集</title>
    <link rel="stylesheet" href="../styles/styles.css?v=20260726-4" />
    <link rel="stylesheet" href="../styles/project-navigation.css?v=20260910-2" />
    <script src="../scripts/project-navigation.js?v=20261018-view-progress-1" defer></script>
    <style>
      .demo-page {
        height: 100vh;
        overflow: hidden;
      }

      .demo-action-bar {
        position: relative;
        z-index: 2;
        height: 44px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid rgba(16, 18, 24, .055);
        background: #f8f9fb;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        box-shadow: none;
        color: #1b1c22;
        font-family: "Space Grotesk", "Noto Sans SC", "Source Han Sans SC", "PingFang SC", Arial, sans-serif;
      }

      .demo-action-label {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: rgba(27, 28, 34, .72);
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .demo-action-heading {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .demo-action-label::before {
        content: "";
        flex: 0 0 7px;
        width: 7px;
        height: 7px;
        border: 2px solid rgba(27, 28, 34, .54);
        border-radius: 50%;
        background: transparent;
        box-shadow: 0 0 0 3px rgba(27, 28, 34, .035);
      }

      .demo-action-help-wrap {
        position: relative;
        display: inline-flex;
        flex: 0 0 auto;
      }

      .demo-action-help {
        display: grid;
        width: 20px;
        height: 20px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: rgba(27, 28, 34, .48);
        cursor: help;
        transition: color .2s ease, background-color .2s ease;
      }

      .demo-action-help:hover,
      .demo-action-help:focus-visible,
      .demo-action-help[aria-expanded="true"] {
        background: rgba(16, 18, 24, .06);
        color: rgba(27, 28, 34, .82);
        outline: none;
      }

      .demo-action-help:focus-visible {
        box-shadow: 0 0 0 2px rgba(27, 28, 34, .14);
      }

      .demo-action-help svg {
        width: 14px;
        height: 14px;
      }

      .demo-action-tooltip {
        position: absolute;
        z-index: 8;
        top: calc(100% + 9px);
        left: -8px;
        width: min(270px, calc(100vw - 104px));
        padding: 10px 12px;
        border: 1px solid rgba(16, 18, 24, .1);
        border-radius: 8px;
        background: rgba(255, 255, 255, .94);
        -webkit-backdrop-filter: blur(18px) saturate(110%);
        backdrop-filter: blur(18px) saturate(110%);
        box-shadow: 0 10px 28px rgba(15, 23, 42, .14), inset 0 1px rgba(255, 255, 255, .8);
        color: rgba(27, 28, 34, .78);
        font-size: 12px;
        font-weight: 400;
        line-height: 1.55;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity .18s ease, transform .2s cubic-bezier(.22, 1, .36, 1), visibility .18s;
        visibility: hidden;
        white-space: normal;
      }

      .demo-action-tooltip::before {
        position: absolute;
        top: -5px;
        left: 13px;
        width: 8px;
        height: 8px;
        border-top: 1px solid rgba(16, 18, 24, .1);
        border-left: 1px solid rgba(16, 18, 24, .1);
        background: rgba(255, 255, 255, .94);
        content: "";
        transform: rotate(45deg);
      }

      .demo-action-help-wrap:hover .demo-action-tooltip,
      .demo-action-help-wrap:focus-within .demo-action-tooltip,
      .demo-action-help-wrap.is-open .demo-action-tooltip {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
      }

      .demo-action-controls {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
      }

      .demo-action-controls button {
        height: 32px;
        padding: 0 13px;
        border: 1px solid rgba(16, 18, 24, .1);
        border-radius: 999px;
        background: rgba(255, 255, 255, .62);
        color: rgba(27, 28, 34, .72);
        box-shadow: 0 1px 5px rgba(15, 23, 42, .045), inset 0 1px rgba(255, 255, 255, .62);
        font: 500 12px/1 "Space Grotesk", "Noto Sans SC", "Source Han Sans SC", "PingFang SC", Arial, sans-serif;
        letter-spacing: 0;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color .2s ease, border-color .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
      }

      .demo-action-controls button:hover,
      .demo-action-controls button:focus-visible {
        border-color: rgba(16, 18, 24, .18);
        background: rgba(16, 18, 24, .08);
        color: #1b1c22;
        box-shadow: inset 0 0 0 1px rgba(16, 18, 24, .04);
        outline: none;
      }

      .demo-action-controls button:focus-visible {
        outline: 2px solid rgba(27, 28, 34, .24);
        outline-offset: 2px;
      }

      .demo-action-controls button:active {
        transform: translateY(1px);
      }

      @media (hover: hover) and (pointer: fine) {
        body.demo-nav-hidden > .project-nav {
          transform: translateY(calc(-100% - 52px)) !important;
        }

        body.demo-nav-hidden.demo-nav-hovering > .project-nav,
        body.demo-nav-hidden > .project-nav:focus-within {
          transform: translateY(0) !important;
        }

        body.demo-nav-hidden > .demo-nav-companion {
          position: fixed;
          inset: 56px 0 auto;
          z-index: 1199;
          width: 100%;
          transform: translateY(calc(-100% - 64px));
          transition: transform .32s cubic-bezier(.22, 1, .36, 1);
        }

        body.demo-nav-hidden.demo-nav-hovering > .demo-nav-companion,
        body.demo-nav-hidden > .demo-nav-companion:focus-within {
          transform: translateY(0);
        }

        body.demo-nav-hidden:has(> .demo-nav-companion:focus-within) > .project-nav {
          transform: translateY(0) !important;
        }

        body.demo-page.demo-nav-hidden .demo-shell {
          height: 100vh !important;
        }
      }

      .demo-shell {
        height: calc(100vh - 100px);
        padding: 0 18px 18px;
        display: flex;
        background: #edf0f7;
      }

      .demo-shell iframe {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(36, 40, 72, .12);
      }

      @media (max-width: 700px) {
        .demo-action-bar {
          padding: 0 10px;
          gap: 10px;
        }

        .demo-action-label {
          gap: 7px;
          font-size: 11px;
        }

        .demo-action-controls {
          gap: 5px;
        }

        .demo-action-controls button {
          height: 30px;
          padding: 0 9px;
          font-size: 11px;
        }

      }
    </style>
    <link rel="stylesheet" href="../styles/responsive-system.css?v=20260905-1" />

    <style id="remi-demo-shell-sizing">
      body.demo-page:not(.demo-nav-hidden) .demo-shell { height: calc(100vh - 56px) !important; height: calc(100dvh - 56px) !important; }
      @media(max-width:700px) {
        body.demo-page:not(.demo-nav-hidden) .demo-shell { height: calc(100vh - 46px) !important; height: calc(100dvh - 46px) !important; }
      }
    </style>

    <style id="remi-white-navigation">
      body.demo-page { background: #fff !important; }
      body.demo-page > .project-nav,
      body.demo-page > .project-nav.is-scrolled,
      body.demo-page > .project-nav.project-nav--compact {
        background: #fff !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
        border-bottom: 1px solid #efedf2 !important;
      }
    </style>
  </head>
  <body class="demo-page light-project-nav">
    <header class="project-nav"><a class="project-back" href="../index.html" aria-label="返回首页"><span aria-hidden="true">←</span><span class="project-back-label">返回首页</span></a><p class="project-nav-title">主动式 AI 记忆助手</p><label class="project-view-switch"><span>当前展示</span><select aria-label="切换主动式 AI 记忆助手展示" data-view-switch data-current="remi.html"><option value="case.html">项目案例</option><option value="remi.html" selected>交互 Demo</option><option value="remi-materials.html">交付物</option></select></label></header>
    <main class="demo-shell">
      <iframe id="remi-demo-frame" title="Remi AI 记忆助手交互项目" src="https://ocelot-uxui.github.io/remi-app/"></iframe>
    </main>
    <script>
      document.querySelectorAll("[data-view-switch]").forEach((viewSwitch) => {
        viewSwitch.addEventListener("change", () => {
          const option = viewSwitch.selectedOptions[0];
          if (!option.value) return;
          if (option.dataset.external === "true") {
            window.open(option.value, "_blank", "noopener");
            viewSwitch.value = viewSwitch.dataset.current;
            return;
          }
          window.location.href = option.value;
        });
      });

      const demoFrame = document.querySelector("#remi-demo-frame");
      if (location.hostname === "127.0.0.1" && new URLSearchParams(location.search).has("demoLocal")) {
        demoFrame.src = "http://127.0.0.1:8765/refined.html?v=bottom-fade";
      }
    </script>
  </body>
</html>
