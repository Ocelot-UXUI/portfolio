<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI 设计工作流实践项目交付物｜郭昱成作品集" />
    <title>AI 设计工作流交付物 | 郭昱成作品集</title>
    <link rel="stylesheet" href="../styles/styles.css?v=20260726-8" />
    <link rel="stylesheet" href="../styles/project-navigation.css?v=20260809-14" />
    <script src="../scripts/project-navigation.js?v=20260809-3" defer></script>
    <style>
      .dodo-document{width:min(100%,980px)}
      .dodo-document pre{margin:0 0 18px;padding:16px 18px;overflow:auto;border:1px solid rgba(255,255,255,.14);background:#0d0f17;color:#d9dbe1;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
      .dodo-document code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .dodo-document :not(pre)>code{padding:2px 5px;border-radius:3px;background:rgba(255,255,255,.08);font-size:.9em}
      .dodo-document .research-callout{margin:0 0 2px!important}
      .dodo-document table{width:100%;margin:0 0 20px;border-collapse:collapse;border:1px solid rgba(255,255,255,.14);font-size:13px;line-height:1.6}
      .dodo-document th,.dodo-document td{padding:10px 12px;vertical-align:top;border:1px solid rgba(255,255,255,.1);text-align:left}
      .dodo-document th{background:#171a25;color:#fff;font-weight:650}
      /* 交付物页只保留内容需要的间距，避免文档之间出现空区。 */
      .deliverables-shell{padding-top:clamp(48px,6vw,80px);padding-bottom:72px}
      .deliverables-tabs{margin-top:36px}
      .deliverables-content{margin-top:32px}
      .deliverable-panel{padding-top:24px}
      .research-subtabs{margin-bottom:20px}
      @media(max-width:700px){.dodo-document pre{padding:13px 14px;font-size:11px}.dodo-document table{font-size:12px}.dodo-document th,.dodo-document td{min-width:132px;padding:9px 10px}}
    </style>
    <link rel="stylesheet" href="../styles/responsive-system.css?v=20260905-1" />
  </head>
  <body class="deliverables-page">
    <header class="project-nav">
      <a class="project-back" href="../index.html" aria-label="返回首页"><span aria-hidden="true">←</span><span class="project-back-label">返回首页</span></a>
      <p class="project-nav-title">AI 设计工作流实践与复盘</p>
      <label class="project-view-switch"><span>当前展示</span><select aria-label="切换 AI 设计工作流项目展示" data-view-switch data-current="dodo-materials.html"><option value="dodo.html">项目案例</option><option value="dodo-demo.html">交互 Demo</option><option value="dodo-materials.html" selected>交付物</option></select></label>
    </header>
    <main class="deliverables-main">
      <section class="deliverables-shell" aria-labelledby="dodo-materials-title">
        <h1 id="dodo-materials-title">交付物</h1>
        <div class="deliverables-tabs" role="tablist" aria-label="Dodo 交付物分类">
          <button type="button" role="tab" aria-controls="guidelines-panel" aria-selected="true" tabindex="0" data-deliverable-tab="guidelines">设计规范</button>
          <button type="button" role="tab" aria-controls="review-panel" aria-selected="false" tabindex="-1" data-deliverable-tab="review">设计走查 Skill</button>
        </div>
        <div class="deliverables-content" aria-live="polite">
          <section class="deliverable-panel" id="guidelines-panel" data-deliverable-panel="guidelines" role="tabpanel">
            <div class="research-subtabs" role="tablist" aria-label="Dodo 设计规范文档">
              <button type="button" role="tab" aria-selected="true" tabindex="0" data-guideline-tab="experience">体验设计指南</button>
              <button type="button" role="tab" aria-selected="false" tabindex="-1" data-guideline-tab="interaction">产品知识基座</button>
            </div>
            <section class="research-subpanel" data-guideline-panel="experience" role="tabpanel"></section>
            <section class="research-subpanel" data-guideline-panel="interaction" role="tabpanel" hidden></section>
          </section>
          <section class="deliverable-panel" id="review-panel" data-deliverable-panel="review" role="tabpanel" hidden>
            <section class="research-subpanel" data-review-document aria-label="工作负载页面完整设计走查报告"></section>
          </section>
        </div>
      </section>
    </main>
    <footer>AI DESIGN WORKFLOW · DELIVERABLES · 2026</footer>
    <script src="dodo-materials-data.js?v=20260827-1"></script>
    <script src="dodo-materials-review-data.js?v=20260827-2"></script>
    <script>
      const stickyNav = document.querySelector("header.project-nav");
      let previousScrollY = window.scrollY;
      let downwardScrollDistance = 0;
      const NAV_HIDE_DISTANCE = 24;
      const updateStickyNav = () => {
        if (!stickyNav) return;
        const currentScrollY = window.scrollY;
        const compact = currentScrollY > 96;
        const scrollDelta = currentScrollY - previousScrollY;
        if (!compact || scrollDelta <= 0) downwardScrollDistance = 0;
        else downwardScrollDistance += scrollDelta;
        stickyNav.classList.toggle("is-scrolled", currentScrollY > 16);
        stickyNav.classList.toggle("project-nav--compact", compact);
        stickyNav.classList.toggle("project-nav--hidden", compact && downwardScrollDistance >= NAV_HIDE_DISTANCE);
        previousScrollY = currentScrollY;
      };
      updateStickyNav();
      window.addEventListener("scroll", updateStickyNav, { passive: true });

      const appendInlineMarkdown = (element, content) => {
        const segments = content.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
        segments.forEach((segment) => {
          if (segment.startsWith("**") && segment.endsWith("**")) {
            const strong = document.createElement("strong");
            strong.textContent = segment.slice(2, -2);
            element.append(strong);
          } else if (segment.startsWith("`") && segment.endsWith("`")) {
            const code = document.createElement("code");
            code.textContent = segment.slice(1, -1);
            element.append(code);
          } else {
            element.append(document.createTextNode(segment.replace(/\\([+_()])/g, "$1")));
          }
        });
      };

      const parseTableCells = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
      const isTableDivider = (line) => /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line.trim());
      const renderDocument = (panel, markdown, titleOverride) => {
        if (!panel || panel.dataset.rendered === "true") return;
        panel.dataset.rendered = "true";
        const article = document.createElement("article");
        article.className = "research-document dodo-document";
        const lines = markdown.split(/\r?\n/);
        let list = null;
        let codeLines = null;
        let table = null;
        let tableBody = null;
        let tableHasHeader = false;
        const closeTable = () => {
          if (!table) return;
          table.append(tableBody);
          article.append(table);
          table = null;
          tableBody = null;
          tableHasHeader = false;
        };
        const closeList = () => { list = null; };

        lines.forEach((line, index) => {
          if (line.startsWith("```")) {
            closeList();
            closeTable();
            if (codeLines) {
              const pre = document.createElement("pre");
              const code = document.createElement("code");
              code.textContent = codeLines.join("\n");
              pre.append(code);
              article.append(pre);
              codeLines = null;
            } else {
              codeLines = [];
            }
            return;
          }
          if (codeLines) {
            codeLines.push(line);
            return;
          }
          if (line.trim().startsWith("|")) {
            closeList();
            if (isTableDivider(line)) return;
            if (!table) {
              table = document.createElement("table");
              tableBody = document.createElement("tbody");
            }
            const row = document.createElement("tr");
            const useHeader = !tableHasHeader;
            parseTableCells(line).forEach((cell) => {
              const item = document.createElement(useHeader ? "th" : "td");
              appendInlineMarkdown(item, cell);
              row.append(item);
            });
            tableBody.append(row);
            tableHasHeader = true;
            return;
          }
          closeTable();
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (heading) {
            closeList();
            const level = heading[1].length;
            const element = document.createElement(level === 1 ? "h2" : level === 2 ? "h3" : "h4");
            appendInlineMarkdown(element, level === 1 && titleOverride ? titleOverride : heading[2]);
            article.append(element);
            return;
          }
          if (line.trim() === "---") {
            closeList();
            article.append(document.createElement("hr"));
            return;
          }
          if (unordered || ordered) {
            const type = unordered ? "ul" : "ol";
            if (!list || list.tagName.toLowerCase() !== type) {
              list = document.createElement(type);
              article.append(list);
            }
            const item = document.createElement("li");
            appendInlineMarkdown(item, (unordered || ordered)[1]);
            list.append(item);
            return;
          }
          if (line.startsWith(">")) {
            closeList();
            const quoteText = line.replace(/^>\s?/, "").trim();
            if (!quoteText) return;
            const callout = document.createElement("p");
            callout.className = "research-callout";
            appendInlineMarkdown(callout, quoteText);
            article.append(callout);
            return;
          }
          if (line.trim()) {
            closeList();
            const paragraph = document.createElement("p");
            appendInlineMarkdown(paragraph, line.trim());
            article.append(paragraph);
          } else {
            closeList();
          }
          if (index === lines.length - 1) closeTable();
        });
        if (codeLines) {
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.textContent = codeLines.join("\n");
          pre.append(code);
          article.append(pre);
        }
        closeTable();
        panel.append(article);
      };

      const guidelineTabs = [...document.querySelectorAll("[data-guideline-tab]")];
      const guidelinePanels = [...document.querySelectorAll("[data-guideline-panel]")];
      const showGuideline = (target) => {
        guidelineTabs.forEach((tab) => {
          const selected = tab.dataset.guidelineTab === target;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        guidelinePanels.forEach((panel) => {
          const selected = panel.dataset.guidelinePanel === target;
          panel.hidden = !selected;
          if (selected) {
            renderDocument(
              panel,
              window.dodoDeliverableDocuments?.[target] || "",
              target === "interaction" ? "产品知识基座" : undefined
            );
          }
        });
      };
      guidelineTabs.forEach((tab) => tab.addEventListener("click", () => showGuideline(tab.dataset.guidelineTab)));
      showGuideline("experience");

      const deliverableTabs = [...document.querySelectorAll(".deliverables-tabs [role=tab]")];
      const deliverablePanels = [...document.querySelectorAll("[data-deliverable-panel]")];
      deliverableTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const target = tab.dataset.deliverableTab;
          deliverableTabs.forEach((item) => {
            const selected = item === tab;
            item.setAttribute("aria-selected", String(selected));
            item.tabIndex = selected ? 0 : -1;
          });
          deliverablePanels.forEach((panel) => {
            panel.hidden = panel.dataset.deliverablePanel !== target;
          });
          if (target === "review") {
            renderDocument(document.querySelector("[data-review-document]"), window.dodoReviewDocument || "");
          }
        });
      });
    </script>
  </body>
</html>
