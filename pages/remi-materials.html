<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="郭昱成 UX/UI 作品集 - 主动式 AI 记忆助手用户调研" />
    <title>主动式 AI 记忆助手交付物 | 郭昱成作品集</title>
    <link rel="stylesheet" href="../styles/styles.css?v=20260725-2" />
  </head>
  <body class="deliverables-page">
    <header class="project-nav">
      <a class="project-back" href="../index.html" aria-label="返回首页"><span aria-hidden="true">←</span> 返回首页</a>
      <p class="project-nav-title">主动式 AI 记忆助手</p>
      <a class="project-back" href="case.html" aria-label="查看案例 Deck">案例 Deck</a>
    </header>
    <main class="deliverables-main">
      <section class="deliverables-shell" aria-labelledby="materials-title">
        <h1 id="materials-title">交付物</h1>
        <div class="research-subtabs" role="tablist" aria-label="用户调研材料">
          <button type="button" role="tab" aria-selected="true" tabindex="0" data-research-tab="document">调研文档</button>
          <button type="button" role="tab" aria-selected="false" tabindex="-1" data-research-tab="interview">调研具体内容</button>
        </div>
        <section class="research-subpanel" data-research-panel="document" role="tabpanel"></section>
        <section class="research-subpanel" data-research-panel="interview" role="tabpanel" hidden></section>
      </section>
    </main>
    <script src="remi-research-data.js?v=20260725-2"></script>
    <script>
      const cellReference = (column, row) => {
        let label = "";
        let value = column + 1;
        while (value) {
          const remainder = (value - 1) % 26;
          label = String.fromCharCode(65 + remainder) + label;
          value = Math.floor((value - 1) / 26);
        }
        return `${label}${row + 1}`;
      };
      const columnIndex = (label) => [...label].reduce((total, char) => total * 26 + char.charCodeAt(0) - 64, 0) - 1;
      const mergeMap = (ranges) => {
        const spans = new Map();
        const skipped = new Set();
        ranges.forEach((range) => {
          const [start, end] = range.split(":");
          const [, startLabel, startRow] = start.match(/^([A-Z]+)(\d+)$/);
          const [, endLabel, endRow] = end.match(/^([A-Z]+)(\d+)$/);
          const fromColumn = columnIndex(startLabel);
          const toColumn = columnIndex(endLabel);
          const fromRow = Number(startRow) - 1;
          const toRow = Number(endRow) - 1;
          spans.set(start, { colSpan: toColumn - fromColumn + 1, rowSpan: toRow - fromRow + 1 });
          for (let row = fromRow; row <= toRow; row += 1) for (let column = fromColumn; column <= toColumn; column += 1) {
            const reference = cellReference(column, row);
            if (reference !== start) skipped.add(reference);
          }
        });
        return { spans, skipped };
      };
      const interviewPanel = document.querySelector('[data-research-panel="interview"]');
      const documentPanel = document.querySelector('[data-research-panel="document"]');
      const title = document.createElement("h2");
      title.className = "research-section-title";
      title.textContent = window.remiResearch.interview.name;
      const scroll = document.createElement("div");
      scroll.className = "research-table-scroll";
      const table = document.createElement("table");
      table.className = "research-table";
      const body = document.createElement("tbody");
      const { spans, skipped } = mergeMap(window.remiResearch.interview.merges);
      window.remiResearch.interview.rows.forEach((row, rowIndex) => {
        const tr = document.createElement("tr");
        for (let column = 0; column < window.remiResearch.interview.columnCount; column += 1) {
          const reference = cellReference(column, rowIndex);
          if (skipped.has(reference)) continue;
          const cell = document.createElement(rowIndex === 0 ? "th" : "td");
          const span = spans.get(reference);
          if (span) { cell.colSpan = span.colSpan; cell.rowSpan = span.rowSpan; }
          const text = document.createElement("span");
          text.className = "research-cell-text";
          text.textContent = row[column] || "";
          cell.append(text);
          tr.append(cell);
        }
        body.append(tr);
      });
      table.append(body);
      scroll.append(table);
      interviewPanel.append(title, scroll);
      const documentArticle = document.createElement("article");
      documentArticle.className = "research-document";
      window.remiResearch.document.split(/\r?\n/).forEach((line) => {
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const element = document.createElement(heading[1].length === 1 ? "h2" : heading[1].length === 2 ? "h3" : "h4");
          element.textContent = heading[2].replace(/\*\*/g, "");
          documentArticle.append(element);
        } else if (line.trim() === "---") {
          documentArticle.append(document.createElement("hr"));
        } else if (line.trim()) {
          const paragraph = document.createElement("p");
          paragraph.textContent = line.replace(/^>\s?/, "").replace(/\*\*/g, "");
          documentArticle.append(paragraph);
        }
      });
      documentPanel.append(documentArticle);
      const tabs = [...document.querySelectorAll("[data-research-tab]")];
      const panels = [...document.querySelectorAll("[data-research-panel]")];
      tabs.forEach((tab) => tab.addEventListener("click", () => {
        tabs.forEach((item) => item.setAttribute("aria-selected", String(item === tab)));
        panels.forEach((panel) => { panel.hidden = panel.dataset.researchPanel !== tab.dataset.researchTab; });
      }));
    </script>
  </body>
</html>
