    <script>
      const stickyNav = document.querySelector("header");
      const updateStickyNav = () => stickyNav?.classList.toggle("is-scrolled", window.scrollY > 16);
      updateStickyNav();
      window.addEventListener("scroll", updateStickyNav, { passive: true });
      document.querySelectorAll("[data-view-switch]").forEach((viewSwitch) => {
        viewSwitch.addEventListener("change", () => {
          const option = viewSwitch.selectedOptions[0];
          if (!option.value) return;
          if (option.dataset.external === "true") {
            window.open(option.value, "_blank", "noopener");
            viewSwitch.value = viewSwitch.dataset.current;
            return;
          }
          window.location.href = option.value;
        });
      });

      const caseCursor = document.querySelector(".project-hover-cursor");
      const caseHotspots = document.querySelectorAll("[data-case-hotspot]");
      if (caseCursor && caseHotspots.length && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const updateCaseCursor = (event) => {
          caseCursor.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
        };
        caseHotspots.forEach((hotspot) => {
          hotspot.addEventListener("pointerenter", (event) => {
            updateCaseCursor(event);
            caseCursor.classList.add("visible");
          });
          hotspot.addEventListener("pointermove", updateCaseCursor);
          hotspot.addEventListener("pointerleave", () => caseCursor.classList.remove("visible"));
        });
      }
    </script>
