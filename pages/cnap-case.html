    <script>
      const stickyNav = document.querySelector("header.project-nav");
      let previousScrollY = window.scrollY;
      let downwardScrollDistance = 0;
      const NAV_HIDE_DISTANCE = 24;
      const updateStickyNav = () => {
        if (!stickyNav) return;
        const currentScrollY = window.scrollY;
        const compact = currentScrollY > 96;
        const scrollDelta = currentScrollY - previousScrollY;
        if (!compact || scrollDelta <= 0) downwardScrollDistance = 0;
        else downwardScrollDistance += scrollDelta;
        stickyNav.classList.toggle("is-scrolled", currentScrollY > 16);
        stickyNav.classList.toggle("project-nav--compact", compact);
        stickyNav.classList.toggle("project-nav--hidden", compact && downwardScrollDistance >= NAV_HIDE_DISTANCE);
        previousScrollY = currentScrollY;
      };
      updateStickyNav();
      window.addEventListener("scroll", updateStickyNav, { passive: true });
      document.querySelectorAll("[data-view-switch]").forEach((viewSwitch) => {
        viewSwitch.addEventListener("change", () => {
          const option = viewSwitch.selectedOptions[0];
          if (!option.value) return;
          window.location.href = option.value;
        });
      });

      const caseCursor = document.querySelector(".case-project-hover-cursor");
      const caseCursorLabel = caseCursor?.querySelector(".case-project-hover-label");
      const caseHotspots = document.querySelectorAll("[data-case-hotspot]");
      if (caseCursor && caseCursorLabel && caseHotspots.length && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const cursorMotion = {
          targetX: 0,
          targetY: 0,
          labelX: 0,
          labelY: 0,
          labelRotation: 0,
          initialized: false,
          visible: false,
          pressed: false,
          frame: 0,
        };

        const renderCaseCursor = () => {
          const labelOffsetX = 24;
          const labelOffsetY = 15;
          const nextLabelX = cursorMotion.targetX + labelOffsetX;
          const nextLabelY = cursorMotion.targetY + labelOffsetY;
          const horizontalLag = nextLabelX - cursorMotion.labelX;
          cursorMotion.labelX += horizontalLag * .18;
          cursorMotion.labelY += (nextLabelY - cursorMotion.labelY) * .18;
          const rotationTarget = Math.max(-7, Math.min(7, horizontalLag * .18));
          cursorMotion.labelRotation += (rotationTarget - cursorMotion.labelRotation) * .16;
          const scale = cursorMotion.pressed ? .92 : 1;
          caseCursorLabel.style.transform = `translate3d(${cursorMotion.labelX}px, ${cursorMotion.labelY}px, 0) rotate(${cursorMotion.labelRotation}deg) scale(${scale})`;
          const unsettled = Math.abs(nextLabelX - cursorMotion.labelX) > .1
            || Math.abs(nextLabelY - cursorMotion.labelY) > .1
            || Math.abs(cursorMotion.labelRotation) > .1;
          if (cursorMotion.visible || unsettled) cursorMotion.frame = requestAnimationFrame(renderCaseCursor);
          else cursorMotion.frame = 0;
        };

        const startCaseCursorMotion = () => {
          if (!cursorMotion.frame) cursorMotion.frame = requestAnimationFrame(renderCaseCursor);
        };

        const updateCaseCursor = (event) => {
          cursorMotion.targetX = event.clientX;
          cursorMotion.targetY = event.clientY;
          if (!cursorMotion.initialized) {
            cursorMotion.labelX = event.clientX + 24;
            cursorMotion.labelY = event.clientY + 15;
            cursorMotion.initialized = true;
          }
          startCaseCursorMotion();
        };

        caseHotspots.forEach((hotspot) => {
          hotspot.addEventListener("pointerenter", (event) => {
            updateCaseCursor(event);
            cursorMotion.visible = true;
            caseCursor.classList.add("visible");
          });
          hotspot.addEventListener("pointermove", updateCaseCursor);
          hotspot.addEventListener("pointerleave", () => {
            cursorMotion.visible = false;
            cursorMotion.pressed = false;
            caseCursor.classList.remove("visible");
          });
          hotspot.addEventListener("pointerdown", () => {
            cursorMotion.pressed = true;
            startCaseCursorMotion();
          });
          hotspot.addEventListener("pointerup", () => {
            cursorMotion.pressed = false;
            startCaseCursorMotion();
          });
        });
      }
    </script>
