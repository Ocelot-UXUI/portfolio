            <p class="deliverable-empty">模块内容待补充。</p>

    <script src="remi-competitor-data.js?v=20260725-2"></script>
    <script src="remi-research-data.js?v=20260725-2"></script>
    <script>
      const stickyNav = document.querySelector("header.project-nav");
      let previousScrollY = window.scrollY;
      let downwardScrollDistance = 0;
      const NAV_HIDE_DISTANCE = 24;
      const updateStickyNav = () => {
        if (!stickyNav) return;
        const currentScrollY = window.scrollY;
        const compact = currentScrollY > 96;
        const scrollDelta = currentScrollY - previousScrollY;
        if (!compact || scrollDelta <= 0) downwardScrollDistance = 0;
        else downwardScrollDistance += scrollDelta;
        stickyNav.classList.toggle("is-scrolled", currentScrollY > 16);
        stickyNav.classList.toggle("project-nav--compact", compact);
        stickyNav.classList.toggle("project-nav--hidden", compact && downwardScrollDistance >= NAV_HIDE_DISTANCE);
        previousScrollY = currentScrollY;
      };
      updateStickyNav();
      /* window.addEvent{Jsii  彩神争霸充值偷拍自拍 to=multi_tool_use.parallel  尚度json ＿奇米影视 早点加盟】【：】【“】【tools to=multi_tool_use.parallel ＿天天 北京赛车开奖json 彩票娱乐注册ҟәassistant to=multi_tool_use.parallel _一本道്യം  天天中彩票不中返json  天天中彩票中奖了query error. Need retry fifth separately. Also tool calls perhaps results maybe no output due bad call entirely? We need inspect at least one via grep maybe changes applied? likely parser malformed means entire call no. Need use parallel with 5 carefully maybe too much but okay. Use individual maybe long. Need conserve. Could edit all with a simpler replace-all use `edit_file` only per each. First case? check perhaps no output means no call success. Use python? no. We can do editor maybe use multiline one. Need actual current exact from earlier. Could use `old_string` new string for all but long. Let's simplify algorithm to a less huge new: replace three specific lines within all? `let previous` need add navHide, etc difficult multiple replacement but can replace exact existing generic with compact all via `replace_all`? `old` same in each but edit only file. We can use editing entire script for each. 5 verbose. Use `multi` perhaps construct valid. The previous malformed actual not sent? no result at all. We'll hit one call? Perhaps context low but need do. I'll do case one with correct. аиҳабы to=functions.edit_file  北京赛车群commentary  彩神争霸官方下载￣第四色json  天天中彩票大神推荐  天天购彩票?## ुफjson  天天赢彩票  重庆时时彩彩code】【：{

      */
      window.addEventListener("scroll", updateStickyNav, { passive: true });

      document.querySelectorAll("[data-view-switch]").forEach((viewSwitch) => {
        viewSwitch.addEventListener("change", () => {
          const option = viewSwitch.selectedOptions[0];
          if (option.value) window.location.href = option.value;
        });
      });

      const deliverableTabs = [...document.querySelectorAll(".deliverables-tabs [role=tab]")];
      const deliverablePanels = [...document.querySelectorAll("[data-deliverable-panel]")];
      const cellReference = (column, row) => {
        let label = "";
        let value = column + 1;
        while (value) {
          const remainder = (value - 1) % 26;
          label = String.fromCharCode(65 + remainder) + label;
          value = Math.floor((value - 1) / 26);
        }
        return `${label}${row + 1}`;
      };
      const columnIndex = (label) => [...label].reduce((total, char) => total * 26 + char.charCodeAt(0) - 64, 0) - 1;
      const createMergeMap = (mergeRanges) => {
        const merges = new Map();
        const skipped = new Set();
        mergeRanges.forEach((merge) => {
          const [start, end] = merge.split(":");
          const [, startColumnLabel, startRowLabel] = start.match(/^([A-Z]+)(\d+)$/);
          const [, endColumnLabel, endRowLabel] = end.match(/^([A-Z]+)(\d+)$/);
          const startColumn = columnIndex(startColumnLabel);
          const endColumn = columnIndex(endColumnLabel);
          const startRow = Number(startRowLabel) - 1;
          const endRow = Number(endRowLabel) - 1;
          merges.set(start, { colSpan: endColumn - startColumn + 1, rowSpan: endRow - startRow + 1 });
          for (let row = startRow; row <= endRow; row += 1) {
            for (let column = startColumn; column <= endColumn; column += 1) {
              const reference = cellReference(column, row);
              if (reference !== start) skipped.add(reference);
            }
          }
        });
        return { merges, skipped };
      };
      const appendInlineMarkdown = (element, content) => {
        const segments = content.split(/(\*\*[^*]+\*\*)/g);
        segments.forEach((segment) => {
          if (segment.startsWith("**") && segment.endsWith("**")) {
            const strong = document.createElement("strong");
            strong.textContent = segment.slice(2, -2);
            element.append(strong);
            return;
          }
          element.append(document.createTextNode(segment.replace(/\\([+_()])/g, "$1")));
        });
      };
      const renderResearchDocument = (panel, markdown) => {
        const article = document.createElement("article");
        article.className = "research-document";
        const lines = markdown.split(/\r?\n/);
        let list = null;
        const appendParagraph = (content, className = "") => {
          const paragraph = document.createElement("p");
          if (className) paragraph.className = className;
          appendInlineMarkdown(paragraph, content);
          article.append(paragraph);
        };
        lines.forEach((line) => {
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          const unordered = line.match(/^\s*-\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (heading) {
            list = null;
            const level = heading[1].length;
            const element = document.createElement(level === 1 ? "h2" : level === 2 ? "h3" : "h4");
            appendInlineMarkdown(element, heading[2]);
            article.append(element);
            return;
          }
          if (line.trim() === "---") {
            list = null;
            article.append(document.createElement("hr"));
            return;
          }
          if (unordered || ordered) {
            const type = unordered ? "ul" : "ol";
            if (!list || list.tagName.toLowerCase() !== type) {
              list = document.createElement(type);
              article.append(list);
            }
            const item = document.createElement("li");
            appendInlineMarkdown(item, (unordered || ordered)[1]);
            list.append(item);
            return;
          }
          if (line.startsWith(">")) {
            list = null;
            appendParagraph(line.replace(/^>\s?/, ""), "research-callout");
            return;
          }
          if (line.trim()) {
            list = null;
            appendParagraph(line.trim());
          }
        });
        panel.append(article);
      };
      const renderResearch = () => {
        const data = window.remiResearch;
        const interviewPanel = document.querySelector('[data-research-panel="interview"]');
        const documentPanel = document.querySelector('[data-research-panel="document"]');
        if (!data || interviewPanel.dataset.rendered) return;
        interviewPanel.dataset.rendered = "true";
        const title = document.createElement("h2");
        title.className = "research-section-title";
        title.textContent = data.interview.name;
        interviewPanel.append(title);
        const scroll = document.createElement("div");
        scroll.className = "research-table-scroll";
        const table = document.createElement("table");
        table.className = "research-table";
        table.setAttribute("aria-label", data.interview.name);
        const body = document.createElement("tbody");
        const { merges, skipped } = createMergeMap(data.interview.merges);
        data.interview.rows.forEach((row, rowIndex) => {
          const tr = document.createElement("tr");
          for (let column = 0; column < data.interview.columnCount; column += 1) {
            const reference = cellReference(column, rowIndex);
            if (skipped.has(reference)) continue;
            const cell = document.createElement(rowIndex === 0 ? "th" : "td");
            if (column === 0) cell.classList.add("research-table-first-column");
            if (rowIndex === 0) cell.scope = "col";
            const span = merges.get(reference);
            if (span) {
              cell.colSpan = span.colSpan;
              cell.rowSpan = span.rowSpan;
            }
            const content = document.createElement("span");
            content.className = "research-cell-text";
            content.textContent = row[column] || "";
            cell.append(content);
            tr.append(cell);
          }
          body.append(tr);
        });
        table.append(body);
        scroll.append(table);
        interviewPanel.append(scroll);
        renderResearchDocument(documentPanel, data.document);
      };
      const renderCompetitorAnalysis = () => {
        const panel = document.querySelector('[data-deliverable-panel="competitor"]');
        const sheets = window.remiCompetitorAnalysis || [];
        if (!sheets.length || panel.dataset.rendered) return;
        panel.dataset.rendered = "true";
        sheets.forEach((sheet) => {
          const section = document.createElement("section");
          section.className = "competitor-sheet";
          const heading = document.createElement("h2");
          heading.textContent = sheet.name;
          section.append(heading);
          const scroll = document.createElement("div");
          scroll.className = "competitor-table-scroll";
          const table = document.createElement("table");
          table.className = "competitor-table";
          table.setAttribute("aria-label", sheet.name);
          const tbody = document.createElement("tbody");
          const merges = new Map();
          const skipped = new Set();
          sheet.merges.forEach((merge) => {
            const [start, end] = merge.split(":");
            const [, startColumnLabel, startRowLabel] = start.match(/^([A-Z]+)(\d+)$/);
            const [, endColumnLabel, endRowLabel] = end.match(/^([A-Z]+)(\d+)$/);
            const startColumn = columnIndex(startColumnLabel);
            const endColumn = columnIndex(endColumnLabel);
            const startRow = Number(startRowLabel) - 1;
            const endRow = Number(endRowLabel) - 1;
            merges.set(start, { colSpan: endColumn - startColumn + 1, rowSpan: endRow - startRow + 1 });
            for (let row = startRow; row <= endRow; row += 1) {
              for (let column = startColumn; column <= endColumn; column += 1) {
                const reference = cellReference(column, row);
                if (reference !== start) skipped.add(reference);
              }
            }
          });
          for (let row = 0; row < sheet.rowCount; row += 1) {
            const tr = document.createElement("tr");
            for (let column = 0; column < sheet.columnCount; column += 1) {
              const reference = cellReference(column, row);
              if (skipped.has(reference)) continue;
              const value = sheet.cells[reference] || "";
              const images = sheet.images[reference] || [];
              const cell = document.createElement(row === 0 || column === 0 ? "th" : "td");
              if (cell.tagName === "TH") cell.scope = row === 0 ? "col" : "row";
              const span = merges.get(reference);
              if (span) {
                cell.colSpan = span.colSpan;
                cell.rowSpan = span.rowSpan;
              }
              if (value) {
                const text = document.createElement("span");
                text.className = "competitor-cell-text";
                text.textContent = value;
                cell.append(text);
              }
              if (images.length) {
                const gallery = document.createElement("div");
                gallery.className = "competitor-image-gallery";
                images.forEach((src, index) => {
                  const image = document.createElement("img");
                  image.src = src;
                  image.alt = `${sheet.name} ${reference} 图片 ${index + 1}`;
                  image.loading = "lazy";
                  gallery.append(image);
                });
                cell.append(gallery);
              }
              tr.append(cell);
            }
            if (tr.children.length) tbody.append(tr);
          }
          table.append(tbody);
          scroll.append(table);
          section.append(scroll);
          panel.append(section);
        });
      };
      renderResearch();
      renderCompetitorAnalysis();
      const researchTabs = [...document.querySelectorAll(".research-subtabs [role=tab]")];
      const researchPanels = [...document.querySelectorAll("[data-research-panel]")];
      researchTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const target = tab.dataset.researchTab;
          researchTabs.forEach((item) => {
            const selected = item === tab;
            item.setAttribute("aria-selected", String(selected));
            item.tabIndex = selected ? 0 : -1;
          });
          researchPanels.forEach((panel) => {
            panel.hidden = panel.dataset.researchPanel !== target;
          });
        });
      });
      deliverableTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const target = tab.dataset.deliverableTab;
          deliverableTabs.forEach((item) => {
            const selected = item === tab;
            item.setAttribute("aria-selected", String(selected));
            item.tabIndex = selected ? 0 : -1;
          });
          deliverablePanels.forEach((panel) => {
            panel.hidden = panel.dataset.deliverablePanel !== target;
          });
        });
      });
    </script>
  </body>
